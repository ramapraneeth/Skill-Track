version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY:-skilltrack_longitudinal_super_secret_jwt_key_2024}
      - NODE_ENV=production
    restart: unless-stopped
